<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario – ZG Impianti</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="Admin/auth-helper.js"></script>
    <script src="data-migration.js"></script>
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.css' rel='stylesheet' />
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></script>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'Segoe UI',Roboto,Arial,sans-serif;background:#f8faff;min-height:100vh}

        /* HEADER */
        .sp-hdr{background:linear-gradient(135deg,#4f46e5,#7c3aed);height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:200;box-shadow:0 2px 10px rgba(79,70,229,.4)}
        .sp-hdr-logo{font-size:16px;font-weight:800;color:#fff;display:flex;align-items:center;gap:8px;line-height:1.2}
        .sp-hdr-logo small{display:block;font-size:11px;font-weight:400;color:rgba(255,255,255,.7)}
        .sp-hbtn{background:rgba(255,255,255,.15);border:none;border-radius:9px;padding:6px 12px;color:#fff;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:5px;transition:background .15s}
        .sp-hbtn:hover{background:rgba(255,255,255,.28)}
        .notif-wrap{position:relative}
        .notif-dot{position:absolute;top:-4px;right:-4px;width:16px;height:16px;background:#ef4444;border-radius:50%;font-size:9px;font-weight:700;color:#fff;display:flex;align-items:center;justify-content:center;border:2px solid #4f46e5}

        /* TABS */
        .sp-tabs{background:#fff;border-bottom:2px solid #e5e7eb;display:flex;position:sticky;top:56px;z-index:190;padding:0 14px}
        .sp-tab{padding:11px 16px;font-size:14px;font-weight:600;color:#6b7280;border:none;background:transparent;cursor:pointer;display:flex;align-items:center;gap:5px;border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .15s;white-space:nowrap}
        .sp-tab:hover{color:#4f46e5}
        .sp-tab.active{color:#4f46e5;border-bottom-color:#4f46e5}
        .tbadge{background:#ef4444;color:#fff;border-radius:9999px;font-size:10px;font-weight:700;padding:1px 5px}

        /* CALENDAR */
        .fc{font-family:'Segoe UI',Roboto,Arial,sans-serif!important}
        .fc .fc-toolbar{flex-wrap:wrap;gap:6px;padding-bottom:12px}
        .fc .fc-toolbar-title{font-size:20px!important;font-weight:600;color:#1e1b4b}
        .fc .fc-button{background:#fff!important;border:1px solid #d1d5db!important;color:#374151!important;border-radius:8px!important;font-size:13px!important;padding:6px 14px!important;box-shadow:none!important;font-weight:500!important}
        .fc .fc-button:hover{background:#f5f3ff!important}
        .fc .fc-button-primary:not(:disabled).fc-button-active,.fc .fc-button-primary:not(:disabled):active{background:#eef2ff!important;border-color:#4f46e5!important;color:#4f46e5!important}
        .fc .fc-today-button{background:#4f46e5!important;color:#fff!important;border-color:#4f46e5!important}
        .fc .fc-event{border-radius:6px!important;border:none!important;font-size:12px!important;padding:2px 6px!important;cursor:pointer!important;transition:opacity .15s}
        .fc .fc-event:hover{opacity:.82}
        .fc-day-today .fc-daygrid-day-number{background:#4f46e5;color:#fff!important;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;margin:2px auto}
        .fc .fc-col-header-cell-cushion{font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;text-decoration:none!important}
        .fc .fc-daygrid-day-number{text-decoration:none!important;font-size:13px;color:#374151}
        .fc .fc-highlight{background:#eef2ff!important}
        .fc .fc-list-event:hover td{background:#f5f3ff}
        .fc .fc-list-day-cushion{background:#eef2ff}
        .fc .fc-timegrid-now-indicator-line{border-color:#ef4444}
        @media(max-width:640px){
            .fc .fc-toolbar{flex-direction:column;align-items:flex-start}
            .fc .fc-toolbar-title{font-size:16px!important}
            .fc .fc-button{font-size:11px!important;padding:5px 9px!important}
        }

        /* MODALS */
        .modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:flex;align-items:flex-end;justify-content:center}
        @media(min-width:640px){.modal-ov{align-items:center}.modal-sh{border-radius:20px!important;max-width:500px!important}}
        .modal-sh{background:#fff;border-radius:22px 22px 0 0;padding:22px 20px 30px;width:100%;max-width:100%;max-height:90vh;overflow-y:auto}
        .modal-handle{width:38px;height:4px;background:#e5e7eb;border-radius:9999px;margin:0 auto 18px}
        .modal-title{font-size:18px;font-weight:700;color:#1e1b4b;margin-bottom:3px}
        .modal-sub{font-size:13px;color:#6b7280;margin-bottom:16px}

        /* FORM */
        .flabel{font-size:12px;font-weight:600;color:#374151;display:block;margin-bottom:4px;margin-top:12px}
        .finput{width:100%;padding:10px 13px;border:2px solid #e5e7eb;border-radius:10px;font-size:14px;outline:none;font-family:inherit;background:#fafafa;transition:border-color .2s}
        .finput:focus{border-color:#4f46e5;background:#fff}
        .ftextarea{width:100%;padding:10px 13px;border:2px solid #e5e7eb;border-radius:10px;font-size:14px;outline:none;resize:vertical;min-height:70px;font-family:inherit;background:#fafafa;transition:border-color .2s}
        .ftextarea:focus{border-color:#4f46e5;background:#fff}
        .frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}

        /* BUTTONS */
        .btn-prim{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border:none;border-radius:11px;padding:12px 18px;font-size:14px;font-weight:700;cursor:pointer;width:100%;transition:opacity .15s}
        .btn-prim:hover{opacity:.9}
        .btn-prim:disabled{opacity:.5;cursor:not-allowed}
        .btn-sec{background:#f3f4f6;color:#374151;border:none;border-radius:11px;padding:12px 18px;font-size:14px;font-weight:600;cursor:pointer;width:100%}
        .btn-sec:hover{background:#e5e7eb}
        .btn-del{background:#fee2e2;color:#991b1b;border:none;border-radius:11px;padding:12px 18px;font-size:14px;font-weight:700;cursor:pointer;width:100%}
        .btn-del:hover{background:#fecaca}
        .brow{display:flex;gap:8px;margin-top:16px}
        .brow>*{flex:1}

        /* NOTES */
        #noteArea{padding:14px 18px;padding-bottom:90px}
        .ncard{background:#fff;border-radius:13px;padding:13px 15px;margin-bottom:9px;box-shadow:0 1px 5px rgba(0,0,0,.05);border-left:4px solid #4f46e5}
        .ncard.elab{border-left-color:#10b981;opacity:.65}
        .fab{position:fixed;bottom:22px;right:20px;background:linear-gradient(135deg,#4f46e5,#7c3aed);border:none;border-radius:14px;color:#fff;padding:13px 18px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 6px 18px rgba(79,70,229,.45);display:flex;align-items:center;gap:7px;z-index:100;transition:transform .15s,box-shadow .15s}
        .fab:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(79,70,229,.5)}

        /* FILTER BAR */
        .fbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 18px 4px}
        .fsel{padding:6px 11px;border:2px solid #e5e7eb;border-radius:9px;font-size:13px;font-weight:600;outline:none;color:#374151;cursor:pointer;background:#fff;transition:border-color .2s}
        .fsel:focus{border-color:#4f46e5}

        /* TOAST */
        #spToast{position:fixed;bottom:72px;left:50%;transform:translateX(-50%);background:#1e1b4b;color:#fff;padding:9px 18px;border-radius:11px;font-size:13px;font-weight:600;z-index:9999;display:none;white-space:nowrap;box-shadow:0 8px 22px rgba(0,0,0,.25)}
        #spToast.on{display:block;animation:tIn .3s ease}
        @keyframes tIn{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

        .hidden{display:none!important}
        .spin{border:3px solid #e5e7eb;border-top-color:#4f46e5;border-radius:50%;width:30px;height:30px;animation:sp .8s linear infinite;margin:30px auto}
        @keyframes sp{to{transform:rotate(360deg)}}
        .empty{text-align:center;padding:44px 20px;color:#9ca3af}
    </style>
</head>
<body>

<!-- HEADER -->
<header class="sp-hdr">
    <div class="sp-hdr-logo">
        ⚡
        <div>ZG Impianti<small id="spUserName">Caricamento...</small></div>
    </div>
    <div style="display:flex;gap:7px;align-items:center">
        <div class="notif-wrap">
            <button class="sp-hbtn" onclick="apriNote()">📝 Note</button>
            <div id="notifDot" class="notif-dot hidden">0</div>
        </div>
        <button class="sp-hbtn" onclick="spLogout()">🚪 Esci</button>
    </div>
</header>

<!-- TABS -->
<nav class="sp-tabs">
    <button class="sp-tab active" id="tab-cal" onclick="switchTab('cal')">📅 Calendario</button>
    <button class="sp-tab" id="tab-note" onclick="switchTab('note')">
        📝 Note Team
        <span id="noteBadge" class="tbadge hidden">0</span>
    </button>
</nav>

<!-- TAB CALENDARIO -->
<div id="tabCal">
    <div class="fbar">
        <select id="filtroUtente" class="fsel" onchange="aggiornaFiltro()">
            <option value="">👥 Tutti</option>
        </select>
        <select id="filtroStato" class="fsel" onchange="aggiornaFiltro()">
            <option value="">Tutti gli stati</option>
            <option value="da_fare">Da fare</option>
            <option value="in_corso">In corso</option>
            <option value="completato">Completato</option>
        </select>
        <button onclick="ricaricaCalendario()" class="sp-hbtn" style="background:#f3f4f6;color:#374151;font-size:12px">🔄</button>
    </div>
    <div style="padding:8px 18px 80px">
        <div id="spCalendar"></div>
    </div>
</div>

<!-- TAB NOTE -->
<div id="tabNote" class="hidden">
    <div id="noteArea">
        <div class="spin"></div>
    </div>
</div>

<!-- FAB contestuale -->
<button class="fab" id="fabBtn" onclick="fabAction()" style="display:none">
    <span id="fabIcon">+</span>
    <span id="fabLabel">Nuovo Evento</span>
</button>

<div id="spToast"></div>

<!-- ===== MODAL: CREA EVENTO ===== -->
<div id="modalCrea" class="modal-ov hidden">
    <div class="modal-sh">
        <div class="modal-handle"></div>
        <div class="modal-title">➕ Nuovo Evento</div>
        <div class="modal-sub">Verrà aggiunto al calendario e ai colleghi assegnati</div>
        <label class="flabel">Titolo *</label>
        <input type="text" id="crTitolo" class="finput" placeholder="Es: Manutenzione impianto cliente Rossi">
        <div class="frow">
            <div><label class="flabel">Data *</label><input type="date" id="crData" class="finput"></div>
            <div><label class="flabel">Priorità</label>
                <select id="crPriorita" class="finput">
                    <option value="normale">Normale</option>
                    <option value="bassa">Bassa</option>
                    <option value="media">Media</option>
                    <option value="alta">Alta</option>
                </select>
            </div>
        </div>
        <div class="frow">
            <div><label class="flabel">Ora Inizio</label><input type="time" id="crOraInizio" class="finput"></div>
            <div><label class="flabel">Ora Fine</label><input type="time" id="crOraFine" class="finput"></div>
        </div>
        <label class="flabel">Descrizione</label>
        <textarea id="crDescrizione" class="ftextarea" placeholder="Note, indirizzo, riferimenti..."></textarea>
        <div class="brow">
            <button class="btn-sec" onclick="closeModal('modalCrea')">Annulla</button>
            <button class="btn-prim" id="btnSalvaCrea" onclick="salvaNuovoEvento()">💾 Aggiungi</button>
        </div>
    </div>
</div>

<!-- ===== MODAL: MODIFICA EVENTO ===== -->
<div id="modalEdit" class="modal-ov hidden">
    <div class="modal-sh">
        <div class="modal-handle"></div>
        <div class="modal-title">✏️ Modifica Evento</div>
        <input type="hidden" id="edTaskId">
        <label class="flabel">Titolo *</label>
        <input type="text" id="edTitolo" class="finput">
        <div class="frow">
            <div><label class="flabel">Data *</label><input type="date" id="edData" class="finput"></div>
            <div><label class="flabel">Stato</label>
                <select id="edStato" class="finput">
                    <option value="da_fare">Da fare</option>
                    <option value="in_corso">In corso</option>
                    <option value="completato">Completato</option>
                    <option value="sospeso">Sospeso</option>
                </select>
            </div>
        </div>
        <div class="frow">
            <div><label class="flabel">Ora Inizio</label><input type="time" id="edOraInizio" class="finput"></div>
            <div><label class="flabel">Ora Fine</label><input type="time" id="edOraFine" class="finput"></div>
        </div>
        <div class="frow">
            <div><label class="flabel">Priorità</label>
                <select id="edPriorita" class="finput">
                    <option value="normale">Normale</option>
                    <option value="bassa">Bassa</option>
                    <option value="media">Media</option>
                    <option value="alta">Alta</option>
                </select>
            </div>
            <div><label class="flabel">Dipendente assegnato</label>
                <div id="edAssegnatoInfo" style="padding:10px 12px;background:#f5f3ff;border-radius:10px;font-size:13px;color:#4f46e5;margin-top:4px;font-weight:600"></div>
            </div>
        </div>
        <label class="flabel">Descrizione</label>
        <textarea id="edDescrizione" class="ftextarea"></textarea>
        <div class="brow">
            <button class="btn-del" onclick="eliminaEvento()">🗑️ Elimina</button>
            <button class="btn-sec" onclick="closeModal('modalEdit')">Annulla</button>
            <button class="btn-prim" id="btnSalvaEdit" onclick="salvaModificaEvento()">💾 Salva</button>
        </div>
    </div>
</div>

<!-- ===== MODAL: NOTA TEAM ===== -->
<div id="modalNota" class="modal-ov hidden">
    <div class="modal-sh">
        <div class="modal-handle"></div>
        <div class="modal-title">📝 Nota per il Team</div>
        <div class="modal-sub">Scrivi una nota visibile a tutti i colleghi admin</div>
        <label class="flabel">Oggetto *</label>
        <input type="text" id="notaTitolo" class="finput" placeholder="Es: Ricordare materiali per lunedì">
        <label class="flabel">Messaggio</label>
        <textarea id="notaTesto" class="ftextarea" placeholder="Dettagli, istruzioni..."></textarea>
        <div class="brow">
            <button class="btn-sec" onclick="closeModal('modalNota')">Annulla</button>
            <button class="btn-prim" onclick="salvaNotaTeam()">📤 Invia Nota</button>
        </div>
    </div>
</div>

<!-- ===== MODAL: SUCCESSO ===== -->
<div id="modalOk" class="modal-ov hidden">
    <div class="modal-sh" style="text-align:center">
        <div class="modal-handle"></div>
        <div style="font-size:48px;margin-bottom:10px">✅</div>
        <div style="font-size:18px;font-weight:700;color:#065f46;margin-bottom:8px" id="okTitle">Salvato!</div>
        <div style="font-size:14px;color:#6b7280;margin-bottom:20px" id="okMsg"></div>
        <button class="btn-prim" style="background:linear-gradient(135deg,#10b981,#059669)" onclick="closeModal('modalOk')">OK</button>
    </div>
</div>

<script>
const _db = window.supabaseClient;
let _user = null;
let _cal = null;
let _allEvents = [];
let _activeTab = 'cal';
let _editingTaskId = null;
let _editingEventTitle = null;

// ===================== INIT =====================
async function init() {
    const { data: { session } } = await _db.auth.getSession();
    if (!session) { window.location.href = '/Admin/index.html'; return; }

    const { data: u } = await _db.from('users').select('id, nome, cognome, ruolo')
        .eq('auth_id', session.user.id).single();

    if (!u || u.ruolo !== 'accesso_speciale') {
        const r = (u?.ruolo || '').toLowerCase();
        window.location.href = ['titolare','tecnico','segreteria'].includes(r) ? '/admin-functional.html' : '/pannello-utente.html';
        return;
    }

    _user = u;
    document.getElementById('spUserName').textContent = u.nome + ' ' + u.cognome;

    await caricaDipendentiFiltro();
    await initCalendar();
    aggiornaBadgeNote();
    document.getElementById('fabBtn').style.display = '';

    document.querySelectorAll('.modal-ov').forEach(el =>
        el.addEventListener('click', e => { if (e.target === el) el.classList.add('hidden'); })
    );
}

// ===================== DIPENDENTI =====================
async function caricaDipendentiFiltro() {
    const { data } = await _db.from('users')
        .select('id, nome, cognome')
        .in('ruolo', ['dipendente','tecnico','titolare','segreteria'])
        .eq('stato', 'attivo').order('nome');
    const sel = document.getElementById('filtroUtente');
    (data || []).forEach(u => {
        const o = document.createElement('option');
        o.value = u.id; o.textContent = '👤 ' + u.nome + ' ' + u.cognome;
        sel.appendChild(o);
    });
}

// ===================== CALENDAR =====================
async function initCalendar() {
    _allEvents = await window.dataManager.syncCalendarFromTasks();
    const isMob = window.innerWidth < 640;

    _cal = new FullCalendar.Calendar(document.getElementById('spCalendar'), {
        locale: 'it',
        initialView: isMob ? 'listWeek' : 'dayGridMonth',
        headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: isMob ? 'listWeek,timeGridDay' : 'dayGridMonth,timeGridWeek,timeGridDay,listWeek'
        },
        buttonText: { today:'Oggi', month:'Mese', week:'Sett.', day:'Giorno', list:'Lista' },
        height: 'auto',
        dayMaxEvents: true,
        nowIndicator: true,
        slotMinTime: '06:00:00',
        slotMaxTime: '22:00:00',
        editable: true,
        selectable: true,
        selectMirror: true,
        unselectAuto: true,
        events: _allEvents,

        // Clic su spazio vuoto → crea evento
        select: function(info) {
            const d = info.startStr.split('T')[0];
            const oraI = info.startStr.includes('T') ? info.startStr.split('T')[1].slice(0,5) : '';
            const oraF = info.endStr && info.endStr.includes('T') ? info.endStr.split('T')[1].slice(0,5) : '';
            document.getElementById('crData').value = d;
            document.getElementById('crOraInizio').value = oraI;
            document.getElementById('crOraFine').value = oraF;
            document.getElementById('crTitolo').value = '';
            document.getElementById('crDescrizione').value = '';
            document.getElementById('crPriorita').value = 'normale';
            openModal('modalCrea');
            _cal.unselect();
        },

        // Clic su evento → modifica
        eventClick: function(info) {
            apriModaleEdit(info.event);
        },

        // Drag → sposta e salva
        eventDrop: function(info) {
            const taskId = info.event.extendedProps.taskId;
            if (!taskId) { info.revert(); return; }
            const newDate = info.event.startStr.split('T')[0];
            const oraI = info.event.startStr.includes('T') ? info.event.startStr.split('T')[1].slice(0,5) : null;
            const oraF = info.event.endStr && info.event.endStr.includes('T') ? info.event.endStr.split('T')[1].slice(0,5) : null;
            salvaMove(taskId, info.event.title, newDate, oraI, oraF, info);
        },

        // Resize → aggiorna orari e salva
        eventResize: function(info) {
            const taskId = info.event.extendedProps.taskId;
            if (!taskId) { info.revert(); return; }
            const newDate = info.event.startStr.split('T')[0];
            const oraI = info.event.startStr.includes('T') ? info.event.startStr.split('T')[1].slice(0,5) : null;
            const oraF = info.event.endStr && info.event.endStr.includes('T') ? info.event.endStr.split('T')[1].slice(0,5) : null;
            salvaMove(taskId, info.event.title, newDate, oraI, oraF, info);
        },

        eventDidMount: function(info) {
            const p = info.event.extendedProps;
            const chi = p.assigneeName || p.userName || '';
            info.el.title = info.event.title + (chi ? ' • ' + chi : '');
        }
    });
    _cal.render();
}

async function ricaricaCalendario() {
    _allEvents = await window.dataManager.syncCalendarFromTasks();
    aggiornaFiltro();
}

function aggiornaFiltro() {
    if (!_cal) return;
    const uid = document.getElementById('filtroUtente').value;
    const stato = document.getElementById('filtroStato').value;
    let ev = _allEvents;
    if (uid) ev = ev.filter(e => e.extendedProps?.userId === uid);
    if (stato) ev = ev.filter(e => e.extendedProps?.stato === stato);
    _cal.removeAllEvents();
    _cal.addEventSource(ev);
}

// ===================== MOVE / RESIZE =====================
async function salvaMove(taskId, titolo, newDate, oraI, oraF, info) {
    try {
        await window.TasksAPI.update(taskId, {
            scadenza: newDate,
            data_inizio: newDate,
            ora_inizio: oraI || null,
            ora_fine: oraF || null
        });
        notificaAdmin(`${_user.nome} ${_user.cognome} ha spostato "${titolo}" al ${newDate}${oraI ? ' ore '+oraI : ''}`);
        spToast('✅ Spostato');
    } catch(e) {
        info.revert();
        spToast('❌ Errore salvataggio');
    }
}

// ===================== CREA EVENTO =====================
async function salvaNuovoEvento() {
    const titolo = document.getElementById('crTitolo').value.trim();
    if (!titolo) { spToast('⚠️ Inserisci un titolo'); return; }
    const data = document.getElementById('crData').value;
    if (!data) { spToast('⚠️ Inserisci una data'); return; }
    const oraI = document.getElementById('crOraInizio').value || null;
    const oraF = document.getElementById('crOraFine').value || null;
    const desc = document.getElementById('crDescrizione').value;
    const prio = document.getElementById('crPriorita').value;

    const btn = document.getElementById('btnSalvaCrea');
    btn.disabled = true; btn.textContent = '⏳ Salvo...';

    try {
        const newTask = await window.TasksAPI.create({
            titolo, descrizione: desc || null,
            scadenza: data, data_inizio: data,
            ora_inizio: oraI, ora_fine: oraF,
            stato: 'da_fare', priorita: prio
        });

        const priColors = { alta:'#ef4444', media:'#f59e0b', bassa:'#10b981', normale:'#4f46e5' };
        const evStart = oraI ? data + 'T' + oraI : data;
        const evEnd = oraF ? data + 'T' + oraF : (oraI ? data + 'T' + oraI : null);
        const newEv = {
            id: 'task-' + newTask.id, title: titolo,
            start: evStart, backgroundColor: priColors[prio] || '#4f46e5', borderColor: 'transparent',
            extendedProps: { taskId: newTask.id, stato: 'da_fare', priorita: prio }
        };
        if (evEnd) newEv.end = evEnd;
        _cal.addEvent(newEv);
        _allEvents.push(newEv);

        closeModal('modalCrea');
        notificaAdmin(`${_user.nome} ${_user.cognome} ha aggiunto "${titolo}" il ${data}`);
        showOk('Aggiunto!', `"${titolo}" aggiunto al calendario per il ${data}`);
    } catch(e) {
        spToast('❌ Errore creazione evento');
        console.error(e);
    }
    btn.disabled = false; btn.textContent = '💾 Aggiungi';
}

// ===================== MODIFICA EVENTO =====================
function apriModaleEdit(event) {
    const p = event.extendedProps;
    _editingTaskId = p.taskId;
    _editingEventTitle = event.title;
    const d = event.startStr ? event.startStr.split('T')[0] : '';
    const oraI = event.startStr?.includes('T') ? event.startStr.split('T')[1].slice(0,5) : (p.oraInizio || '');
    const oraF = event.endStr?.includes('T') ? event.endStr.split('T')[1].slice(0,5) : (p.oraFine || '');
    document.getElementById('edTaskId').value = _editingTaskId || '';
    document.getElementById('edTitolo').value = event.title;
    document.getElementById('edData').value = d;
    document.getElementById('edOraInizio').value = oraI;
    document.getElementById('edOraFine').value = oraF;
    document.getElementById('edStato').value = p.stato || 'da_fare';
    document.getElementById('edPriorita').value = p.priorita || 'normale';
    document.getElementById('edDescrizione').value = p.descrizione || '';
    document.getElementById('edAssegnatoInfo').textContent = p.assigneeName || p.userName || '—';
    openModal('modalEdit');
}

async function salvaModificaEvento() {
    if (!_editingTaskId) { spToast('⚠️ ID task mancante'); return; }
    const titolo = document.getElementById('edTitolo').value.trim();
    if (!titolo) { spToast('⚠️ Inserisci un titolo'); return; }
    const data = document.getElementById('edData').value;
    if (!data) { spToast('⚠️ Inserisci una data'); return; }
    const oraI = document.getElementById('edOraInizio').value || null;
    const oraF = document.getElementById('edOraFine').value || null;
    const stato = document.getElementById('edStato').value;
    const prio = document.getElementById('edPriorita').value;
    const desc = document.getElementById('edDescrizione').value;

    const btn = document.getElementById('btnSalvaEdit');
    btn.disabled = true; btn.textContent = '⏳...';

    try {
        await window.TasksAPI.update(_editingTaskId, {
            titolo, scadenza: data, data_inizio: data,
            ora_inizio: oraI, ora_fine: oraF,
            stato, priorita: prio, descrizione: desc || null
        });

        // Aggiorna evento nel calendario
        const priColors = { alta:'#ef4444', media:'#f59e0b', bassa:'#10b981', normale:'#4f46e5' };
        _cal.getEvents().filter(e => e.extendedProps.taskId === _editingTaskId).forEach(e => {
            e.setProp('title', titolo);
            e.setProp('backgroundColor', priColors[prio] || '#4f46e5');
            e.setStart(oraI ? data + 'T' + oraI : data);
            if (oraF) e.setEnd(data + 'T' + oraF);
        });

        closeModal('modalEdit');
        notificaAdmin(`${_user.nome} ${_user.cognome} ha modificato "${titolo}" → stato: ${stato}, data: ${data}`);
        spToast('✅ Salvato');
    } catch(e) {
        spToast('❌ Errore salvataggio');
        console.error(e);
    }
    btn.disabled = false; btn.textContent = '💾 Salva';
}

async function eliminaEvento() {
    if (!_editingTaskId) return;
    if (!confirm(`Eliminare "${_editingEventTitle}"?`)) return;
    try {
        await window.TasksAPI.delete(_editingTaskId);
        _cal.getEvents().filter(e => e.extendedProps.taskId === _editingTaskId).forEach(e => e.remove());
        _allEvents = _allEvents.filter(e => e.extendedProps?.taskId !== _editingTaskId);
        closeModal('modalEdit');
        notificaAdmin(`${_user.nome} ${_user.cognome} ha eliminato "${_editingEventTitle}"`);
        spToast('🗑️ Eliminato');
    } catch(e) {
        spToast('❌ Errore eliminazione');
    }
}

// ===================== ADMIN NOTIFICATION =====================
async function notificaAdmin(messaggio) {
    try {
        await _db.from('richieste_speciali').insert({
            user_id: _user.id,
            tipo: 'avviso',
            titolo: 'Avviso Calendario',
            descrizione: messaggio,
            task_id: null,
            dati_extra: { auto: true }
        });
    } catch(e) { console.warn('Notifica admin fallita:', e); }
}

// ===================== NOTE TEAM =====================
async function caricaNote() {
    const { data: note } = await _db.from('richieste_speciali').select('*')
        .eq('user_id', _user.id).eq('tipo', 'nota')
        .order('created_at', { ascending: false });

    const area = document.getElementById('noteArea');
    if (!note || note.length === 0) {
        area.innerHTML = `<div class="empty"><div style="font-size:44px;margin-bottom:10px">📝</div><div style="font-size:15px;font-weight:600;color:#374151">Nessuna nota</div><div style="font-size:13px;margin-top:5px">Usa il pulsante "+ Nota Team" per scrivere al team</div></div>`;
        return;
    }
    area.innerHTML = note.map(n => {
        const d = new Date(n.created_at).toLocaleString('it-IT', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
        return `<div class="ncard ${n.elaborata ? 'elab' : ''}">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:5px">
                <div style="font-size:14px;font-weight:700;color:#1e1b4b;flex:1">${n.titolo}</div>
                <span style="font-size:10px;font-weight:700;padding:2px 7px;border-radius:9999px;margin-left:8px;flex-shrink:0;${n.elaborata ? 'background:#d1fae5;color:#065f46' : 'background:#fef3c7;color:#92400e'}">${n.elaborata ? '✅ Letta' : '⏳ In attesa'}</span>
            </div>
            ${n.descrizione ? `<div style="font-size:13px;color:#4b5563;white-space:pre-wrap;margin-bottom:5px">${n.descrizione}</div>` : ''}
            <div style="font-size:11px;color:#9ca3af">${d}</div>
        </div>`;
    }).join('');
}

async function salvaNotaTeam() {
    const titolo = document.getElementById('notaTitolo').value.trim();
    if (!titolo) { spToast('⚠️ Inserisci un oggetto'); return; }
    const testo = document.getElementById('notaTesto').value.trim();
    try {
        await _db.from('richieste_speciali').insert({
            user_id: _user.id, tipo: 'nota', titolo,
            descrizione: testo || null, task_id: null, dati_extra: {}
        });
        closeModal('modalNota');
        showOk('Nota inviata!', 'Il team riceverà la tua nota e te la risponderà al più presto.');
        await caricaNote();
    } catch(e) { spToast('❌ Errore invio nota'); }
}

async function aggiornaBadgeNote() {
    try {
        const { data } = await _db.from('richieste_speciali').select('id')
            .eq('user_id', _user.id).eq('tipo', 'nota').eq('elaborata', false);
        const count = data?.length || 0;
        const b = document.getElementById('noteBadge');
        b.textContent = count; b.classList.toggle('hidden', count === 0);
        const dot = document.getElementById('notifDot');
        dot.textContent = count; dot.classList.toggle('hidden', count === 0);
    } catch(e) {}
}

// ===================== UI HELPERS =====================
function switchTab(tab) {
    _activeTab = tab;
    document.getElementById('tabCal').classList.toggle('hidden', tab !== 'cal');
    document.getElementById('tabNote').classList.toggle('hidden', tab !== 'note');
    document.getElementById('tab-cal').classList.toggle('active', tab === 'cal');
    document.getElementById('tab-note').classList.toggle('active', tab === 'note');
    const fab = document.getElementById('fabBtn');
    const icon = document.getElementById('fabIcon');
    const lbl = document.getElementById('fabLabel');
    if (tab === 'note') {
        icon.textContent = '📝'; lbl.textContent = 'Nota Team';
        caricaNote();
    } else {
        icon.textContent = '+'; lbl.textContent = 'Nuovo Evento';
        setTimeout(() => _cal?.updateSize(), 60);
    }
}

function fabAction() {
    if (_activeTab === 'note') {
        document.getElementById('notaTitolo').value = '';
        document.getElementById('notaTesto').value = '';
        openModal('modalNota');
    } else {
        document.getElementById('crTitolo').value = '';
        document.getElementById('crData').value = new Date().toISOString().split('T')[0];
        document.getElementById('crOraInizio').value = '';
        document.getElementById('crOraFine').value = '';
        document.getElementById('crDescrizione').value = '';
        document.getElementById('crPriorita').value = 'normale';
        openModal('modalCrea');
    }
}

function apriNote() { switchTab('note'); }

function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

function showOk(title, msg) {
    document.getElementById('okTitle').textContent = title;
    document.getElementById('okMsg').textContent = msg;
    openModal('modalOk');
}

function spToast(msg) {
    const t = document.getElementById('spToast');
    t.textContent = msg; t.classList.add('on');
    setTimeout(() => t.classList.remove('on'), 2800);
}

async function spLogout() {
    await _db.auth.signOut();
    window.location.href = '/Admin/index.html';
}

init().catch(e => {
    console.error(e);
    document.body.innerHTML = '<div style="text-align:center;padding:60px 20px;color:#ef4444"><div style="font-size:40px">❌</div><div style="margin-top:12px;font-size:15px">Errore caricamento.<br>Ricarica la pagina.</div></div>';
});
</script>
