<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magazzino Veloce - AST:ZG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Scanner Barcode -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="/supabase-client.js"></script>
    <script src="/Admin/auth-helper.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="bg-gray-50">

    <!-- Header Compatto -->
    <div class="gradient-bg shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-4">
                    <a href="/admin-functional.html" class="text-white hover:text-gray-200">
                        <i class="fas fa-arrow-left text-xl"></i>
                    </a>
                    <div>
                        <h1 class="text-2xl font-bold text-white">📦 Magazzino Veloce</h1>
                        <p class="text-purple-200 text-sm">Scansiona • Carica • Scarica</p>
                    </div>
                </div>
                <div class="flex items-center space-x-3">
                    <button onclick="toggleScanner()" id="scanBtn" class="bg-white text-purple-600 px-6 py-2 rounded-lg font-bold hover:bg-purple-50 transition-all flex items-center space-x-2">
                        <i class="fas fa-barcode"></i>
                        <span>Scansiona</span>
                    </button>
                    <button onclick="showNuovoProdotto()" class="bg-green-500 text-white px-6 py-2 rounded-lg font-bold hover:bg-green-600 transition-all">
                        <i class="fas fa-plus mr-2"></i>Nuovo
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scanner Area (nascosto di default) -->
    <div id="scannerArea" class="hidden bg-black">
        <div class="max-w-2xl mx-auto p-4">
            <div class="bg-white rounded-lg p-4 mb-4">
                <div class="flex items-center justify-between mb-2">
                    <h3 class="font-bold text-lg">📷 Scanner Barcode/QR</h3>
                    <button onclick="toggleScanner()" class="text-red-600 hover:text-red-800">
                        <i class="fas fa-times text-2xl"></i>
                    </button>
                </div>
                <p class="text-sm text-gray-600">Inquadra il codice a barre del prodotto</p>
            </div>
            <div id="reader" class="rounded-lg overflow-hidden shadow-2xl"></div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="max-w-7xl mx-auto px-4 py-6">
        
        <!-- Stats Compatte -->
        <div class="grid grid-cols-4 gap-4 mb-6">
            <div class="bg-white rounded-lg p-4 shadow-sm border-l-4 border-blue-500">
                <div class="text-sm text-gray-600">Totale</div>
                <div id="statTotal" class="text-2xl font-bold text-gray-900">0</div>
            </div>
            <div class="bg-white rounded-lg p-4 shadow-sm border-l-4 border-green-500">
                <div class="text-sm text-gray-600">Disponibili</div>
                <div id="statDisponibili" class="text-2xl font-bold text-green-600">0</div>
            </div>
            <div class="bg-white rounded-lg p-4 shadow-sm border-l-4 border-orange-500">
                <div class="text-sm text-gray-600">Scorta Bassa</div>
                <div id="statBassa" class="text-2xl font-bold text-orange-600">0</div>
            </div>
            <div class="bg-white rounded-lg p-4 shadow-sm border-l-4 border-red-500">
                <div class="text-sm text-gray-600">Esauriti</div>
                <div id="statEsauriti" class="text-2xl font-bold text-red-600">0</div>
            </div>
        </div>

        <!-- Ricerca Semplice -->
        <div class="bg-white rounded-lg shadow-sm p-4 mb-6">
            <div class="flex items-center space-x-4">
                <div class="flex-1 relative">
                    <i class="fas fa-search absolute left-3 top-3 text-gray-400"></i>
                    <input type="text" 
                           id="searchInput" 
                           placeholder="Cerca prodotto per nome, codice o barcode..."
                           oninput="ricercaProdotti()"
                           class="w-full pl-10 pr-4 py-2 border rounded-lg focus:ring-2 focus:ring-purple-500">
                </div>
                <select id="filtroStock" onchange="ricercaProdotti()" class="px-4 py-2 border rounded-lg">
                    <option value="all">Tutti</option>
                    <option value="disponibili">Disponibili</option>
                    <option value="bassa">Scorta Bassa</option>
                    <option value="esauriti">Esauriti</option>
                </select>
            </div>
        </div>

        <!-- Lista Prodotti (Card View) -->
        <div id="prodottiContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <!-- Caricamento prodotti -->
        </div>

    </div>

    <!-- Modal Movimento Veloce -->
    <div id="movimentoModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full mx-4">
            <div class="gradient-bg p-6 rounded-t-2xl">
                <h3 class="text-2xl font-bold text-white" id="movimentoTitle">Movimento Magazzino</h3>
            </div>
            <div class="p-6">
                <input type="hidden" id="movimentoProdottoId">
                
                <!-- Info Prodotto -->
                <div class="bg-gray-50 rounded-lg p-4 mb-4">
                    <div class="font-bold text-lg" id="movimentoProdottoNome"></div>
                    <div class="text-sm text-gray-600" id="movimentoCodice"></div>
                    <div class="text-sm font-semibold mt-2">
                        Giacenza attuale: <span id="movimentoGiacenzaAttuale" class="text-blue-600">0</span> <span id="movimentoUM">pz</span>
                    </div>
                </div>

                <!-- Tipo Movimento -->
                <div class="mb-4">
                    <label class="block text-sm font-bold text-gray-700 mb-2">Tipo Movimento</label>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="setTipoMovimento('carico')" id="btnCarico" class="px-4 py-3 border-2 border-green-500 text-green-700 rounded-lg font-bold hover:bg-green-50 transition-all">
                            <i class="fas fa-plus-circle mr-2"></i>CARICO
                        </button>
                        <button onclick="setTipoMovimento('scarico')" id="btnScarico" class="px-4 py-3 border-2 border-gray-300 text-gray-500 rounded-lg font-bold hover:bg-red-50 transition-all">
                            <i class="fas fa-minus-circle mr-2"></i>SCARICO
                        </button>
                    </div>
                </div>

                <!-- Quantità -->
                <div class="mb-4">
                    <label class="block text-sm font-bold text-gray-700 mb-2">Quantità</label>
                    <input type="number" 
                           id="movimentoQuantita" 
                           step="0.01" 
                           min="0" 
                           class="w-full px-4 py-3 text-2xl font-bold text-center border-2 rounded-lg focus:ring-2 focus:ring-purple-500">
                </div>

                <!-- Causale -->
                <div class="mb-6">
                    <label class="block text-sm font-bold text-gray-700 mb-2">Causale (opzionale)</label>
                    <input type="text" 
                           id="movimentoCausale" 
                           placeholder="es: Ordine fornitore, Lavorazione, Inventario..."
                           class="w-full px-4 py-2 border rounded-lg">
                </div>

                <!-- Pulsanti -->
                <div class="flex space-x-3">
                    <button onclick="closeMovimentoModal()" class="flex-1 px-4 py-3 border-2 border-gray-300 rounded-lg font-bold hover:bg-gray-50">
                        Annulla
                    </button>
                    <button onclick="salvaMovimento()" class="flex-1 px-4 py-3 bg-gradient-to-r from-green-600 to-emerald-600 text-white rounded-lg font-bold hover:shadow-lg">
                        <i class="fas fa-check mr-2"></i>Conferma
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Nuovo Prodotto -->
    <div id="nuovoProdottoModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center">
        <div class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full mx-4 max-h-[90vh] overflow-y-auto">
            <div class="gradient-bg p-6 rounded-t-2xl sticky top-0">
                <h3 class="text-2xl font-bold text-white">Nuovo Prodotto</h3>
            </div>
            <div class="p-6">
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div class="col-span-2">
                        <label class="block text-sm font-bold text-gray-700 mb-2">Barcode/EAN *</label>
                        <div class="flex space-x-2">
                            <input type="text" id="nuovoBarcode" class="flex-1 px-4 py-2 border-2 rounded-lg focus:ring-2 focus:ring-purple-500" placeholder="Scansiona o inserisci manualmente">
                            <button onclick="scanBarcode()" class="px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700">
                                <i class="fas fa-barcode"></i>
                            </button>
                        </div>
                    </div>
                    <div class="col-span-2">
                        <label class="block text-sm font-bold text-gray-700 mb-2">Descrizione *</label>
                        <input type="text" id="nuovoDescrizione" class="w-full px-4 py-2 border-2 rounded-lg focus:ring-2 focus:ring-purple-500">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">Codice Prodotto</label>
                        <input type="text" id="nuovoCodice" class="w-full px-4 py-2 border rounded-lg">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">Categoria</label>
                        <select id="nuovoCategoria" class="w-full px-4 py-2 border rounded-lg">
                            <option value="Componentistica">Componentistica</option>
                            <option value="Materiali">Materiali</option>
                            <option value="Accessori">Accessori</option>
                            <option value="Antifurto">Antifurto</option>
                            <option value="Videosorveglianza">Videosorveglianza</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">Giacenza Iniziale</label>
                        <input type="number" id="nuovoGiacenza" value="0" step="0.01" class="w-full px-4 py-2 border rounded-lg">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">Unità Misura</label>
                        <select id="nuovoUM" class="w-full px-4 py-2 border rounded-lg">
                            <option value="pz">pz (pezzi)</option>
                            <option value="mt">mt (metri)</option>
                            <option value="kg">kg (kilogrammi)</option>
                            <option value="lt">lt (litri)</option>
                            <option value="conf">conf (confezioni)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">Prezzo Acquisto €</label>
                        <input type="number" id="nuovoPrezzoAcquisto" step="0.01" class="w-full px-4 py-2 border rounded-lg">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">Prezzo Vendita €</label>
                        <input type="number" id="nuovoPrezzoVendita" step="0.01" class="w-full px-4 py-2 border rounded-lg">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">Giacenza Minima</label>
                        <input type="number" id="nuovoGiacenzaMin" value="0" step="0.01" class="w-full px-4 py-2 border rounded-lg">
                    </div>
                </div>
                <div class="flex space-x-3 mt-6">
                    <button onclick="closeNuovoProdottoModal()" class="flex-1 px-4 py-3 border-2 border-gray-300 rounded-lg font-bold hover:bg-gray-50">
                        Annulla
                    </button>
                    <button onclick="salvaNuovoProdotto()" class="flex-1 px-4 py-3 bg-gradient-to-r from-green-600 to-emerald-600 text-white rounded-lg font-bold hover:shadow-lg">
                        <i class="fas fa-save mr-2"></i>Salva Prodotto
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let prodotti = [];
        let currentUser = null;
        let html5QrCode = null;
        let tipoMovimentoSelezionato = 'carico';

        // Inizializzazione
        async function init() {
            try {
                currentUser = await checkAuth();
                if (!currentUser) {
                    window.location.href = '/Admin/index.html';
                    return;
                }
                await caricaProdotti();
            } catch (error) {
                console.error('Errore init:', error);
            }
        }

        // Carica prodotti
        async function caricaProdotti() {
            try {
                const { data, error } = await supabase
                    .from('components')
                    .select('*')
                    .order('descrizione');
                
                if (error) throw error;
                
                prodotti = data || [];
                aggiornaStats();
                renderProdotti();
            } catch (error) {
                console.error('Errore caricamento:', error);
                alert('Errore nel caricamento dei prodotti');
            }
        }

        // Aggiorna statistiche
        function aggiornaStats() {
            const totale = prodotti.length;
            const disponibili = prodotti.filter(p => (p.giacenza || 0) > (p.giacenza_minima || 0)).length;
            const bassa = prodotti.filter(p => {
                const giacenza = p.giacenza || 0;
                const min = p.giacenza_minima || 0;
                return giacenza > 0 && giacenza <= min;
            }).length;
            const esauriti = prodotti.filter(p => (p.giacenza || 0) === 0).length;

            document.getElementById('statTotal').textContent = totale;
            document.getElementById('statDisponibili').textContent = disponibili;
            document.getElementById('statBassa').textContent = bassa;
            document.getElementById('statEsauriti').textContent = esauriti;
        }

        // Render prodotti
        function renderProdotti() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const filtroStock = document.getElementById('filtroStock').value;

            let filtrati = prodotti.filter(p => {
                const matchSearch = !search || 
                    p.descrizione?.toLowerCase().includes(search) ||
                    p.codice?.toLowerCase().includes(search) ||
                    p.barcode?.toLowerCase().includes(search);
                
                if (!matchSearch) return false;

                const giacenza = p.giacenza || 0;
                const min = p.giacenza_minima || 0;

                if (filtroStock === 'disponibili') return giacenza > min;
                if (filtroStock === 'bassa') return giacenza > 0 && giacenza <= min;
                if (filtroStock === 'esauriti') return giacenza === 0;
                return true;
            });

            const container = document.getElementById('prodottiContainer');
            
            if (filtrati.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full text-center py-12">
                        <i class="fas fa-box-open text-gray-300 text-6xl mb-4"></i>
                        <p class="text-gray-500 text-lg">Nessun prodotto trovato</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtrati.map(p => {
                const giacenza = p.giacenza || 0;
                const min = p.giacenza_minima || 0;
                const um = p.um || 'pz';
                
                let badgeColor = 'bg-green-100 text-green-700';
                let iconColor = 'text-green-600';
                let statoText = 'Disponibile';
                
                if (giacenza === 0) {
                    badgeColor = 'bg-red-100 text-red-700';
                    iconColor = 'text-red-600';
                    statoText = 'Esaurito';
                } else if (giacenza <= min) {
                    badgeColor = 'bg-orange-100 text-orange-700';
                    iconColor = 'text-orange-600';
                    statoText = 'Scorta Bassa';
                }

                return `
                    <div class="bg-white rounded-lg shadow-sm hover:shadow-md transition-all p-4 border-l-4 ${giacenza === 0 ? 'border-red-500' : giacenza <= min ? 'border-orange-500' : 'border-green-500'}">
                        <div class="flex items-start justify-between mb-3">
                            <div class="flex-1">
                                <h3 class="font-bold text-gray-900 mb-1">${p.descrizione || 'Senza nome'}</h3>
                                <div class="flex items-center space-x-2 text-sm text-gray-600 mb-2">
                                    ${p.codice ? `<span class="bg-gray-100 px-2 py-0.5 rounded">${p.codice}</span>` : ''}
                                    ${p.barcode ? `<span class="bg-purple-100 text-purple-700 px-2 py-0.5 rounded text-xs"><i class="fas fa-barcode mr-1"></i>${p.barcode}</span>` : ''}
                                </div>
                                <span class="${badgeColor} px-2 py-1 rounded-full text-xs font-bold">
                                    ${statoText}
                                </span>
                            </div>
                        </div>
                        
                        <div class="border-t pt-3 mt-3">
                            <div class="flex items-center justify-between mb-3">
                                <span class="text-sm text-gray-600">Giacenza:</span>
                                <span class="text-2xl font-bold ${iconColor}">${giacenza.toFixed(2)} <span class="text-base">${um}</span></span>
                            </div>
                            
                            <div class="grid grid-cols-2 gap-2">
                                <button onclick="apriMovimento('${p.id}', 'carico')" class="px-3 py-2 bg-green-600 text-white rounded-lg font-bold hover:bg-green-700 transition-all text-sm">
                                    <i class="fas fa-plus mr-1"></i>CARICO
                                </button>
                                <button onclick="apriMovimento('${p.id}', 'scarico')" class="px-3 py-2 bg-red-600 text-white rounded-lg font-bold hover:bg-red-700 transition-all text-sm">
                                    <i class="fas fa-minus mr-1"></i>SCARICO
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Ricerca prodotti
        function ricercaProdotti() {
            renderProdotti();
        }

        // Toggle scanner
        function toggleScanner() {
            const scannerArea = document.getElementById('scannerArea');
            const isHidden = scannerArea.classList.contains('hidden');
            
            if (isHidden) {
                scannerArea.classList.remove('hidden');
                avviaScanner();
            } else {
                scannerArea.classList.add('hidden');
                stopScanner();
            }
        }

        // Avvia scanner
        function avviaScanner() {
            if (html5QrCode) {
                html5QrCode.stop();
            }
            
            html5QrCode = new Html5Qrcode("reader");
            
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 250 } },
                (decodedText) => {
                    cercaProdottoPerBarcode(decodedText);
                    toggleScanner();
                },
                (errorMessage) => {
                    // Ignora errori di scansione
                }
            ).catch(err => {
                console.error("Errore scanner:", err);
                alert("Impossibile avviare la fotocamera");
            });
        }

        // Stop scanner
        function stopScanner() {
            if (html5QrCode) {
                html5QrCode.stop().catch(err => console.error(err));
                html5QrCode = null;
            }
        }

        // Cerca prodotto per barcode
        function cercaProdottoPerBarcode(barcode) {
            const prodotto = prodotti.find(p => p.barcode === barcode);
            
            if (prodotto) {
                apriMovimento(prodotto.id, 'carico');
            } else {
                const conferma = confirm(`Prodotto con barcode "${barcode}" non trovato.\n\nVuoi crearlo?`);
                if (conferma) {
                    showNuovoProdotto();
                    document.getElementById('nuovoBarcode').value = barcode;
                }
            }
        }

        // Apri movimento
        function apriMovimento(prodottoId, tipo = 'carico') {
            const prodotto = prodotti.find(p => p.id === prodottoId);
            if (!prodotto) return;

            document.getElementById('movimentoProdottoId').value = prodottoId;
            document.getElementById('movimentoProdottoNome').textContent = prodotto.descrizione;
            document.getElementById('movimentoCodice').textContent = prodotto.codice || prodotto.barcode || 'N/A';
            document.getElementById('movimentoGiacenzaAttuale').textContent = (prodotto.giacenza || 0).toFixed(2);
            document.getElementById('movimentoUM').textContent = prodotto.um || 'pz';
            document.getElementById('movimentoQuantita').value = '';
            document.getElementById('movimentoCausale').value = '';
            
            setTipoMovimento(tipo);
            document.getElementById('movimentoModal').classList.remove('hidden');
            document.getElementById('movimentoQuantita').focus();
        }

        // Set tipo movimento
        function setTipoMovimento(tipo) {
            tipoMovimentoSelezionato = tipo;
            
            const btnCarico = document.getElementById('btnCarico');
            const btnScarico = document.getElementById('btnScarico');
            
            if (tipo === 'carico') {
                btnCarico.className = 'px-4 py-3 border-2 border-green-500 bg-green-500 text-white rounded-lg font-bold';
                btnScarico.className = 'px-4 py-3 border-2 border-gray-300 text-gray-500 rounded-lg font-bold hover:bg-red-50';
                document.getElementById('movimentoTitle').textContent = 'Carico Magazzino';
            } else {
                btnScarico.className = 'px-4 py-3 border-2 border-red-500 bg-red-500 text-white rounded-lg font-bold';
                btnCarico.className = 'px-4 py-3 border-2 border-gray-300 text-gray-500 rounded-lg font-bold hover:bg-green-50';
                document.getElementById('movimentoTitle').textContent = 'Scarico Magazzino';
            }
        }

        // Salva movimento
        async function salvaMovimento() {
            const prodottoId = document.getElementById('movimentoProdottoId').value;
            const quantita = parseFloat(document.getElementById('movimentoQuantita').value);
            const causale = document.getElementById('movimentoCausale').value;

            if (!quantita || quantita <= 0) {
                alert('Inserisci una quantità valida');
                return;
            }

            const prodotto = prodotti.find(p => p.id === prodottoId);
            if (!prodotto) return;

            try {
                const giacenzaPrima = prodotto.giacenza || 0;
                const giacenzaDopo = tipoMovimentoSelezionato === 'carico' 
                    ? giacenzaPrima + quantita 
                    : giacenzaPrima - quantita;

                if (giacenzaDopo < 0) {
                    alert('Giacenza insufficiente per lo scarico!');
                    return;
                }

                // Aggiorna giacenza
                const { error: updateError } = await supabase
                    .from('components')
                    .update({ giacenza: giacenzaDopo })
                    .eq('id', prodottoId);

                if (updateError) throw updateError;

                // Crea movimento
                const { error: movError } = await supabase
                    .from('movimenti_magazzino')
                    .insert({
                        prodotto_id: prodottoId,
                        tipo_movimento: tipoMovimentoSelezionato,
                        quantita: tipoMovimentoSelezionato === 'carico' ? quantita : -quantita,
                        giacenza_prima: giacenzaPrima,
                        giacenza_dopo: giacenzaDopo,
                        causale: causale || (tipoMovimentoSelezionato === 'carico' ? 'Carico manuale' : 'Scarico manuale'),
                        created_by: currentUser.id
                    });

                if (movError) throw movError;

                alert(`✅ ${tipoMovimentoSelezionato === 'carico' ? 'Carico' : 'Scarico'} registrato con successo!`);
                closeMovimentoModal();
                await caricaProdotti();

            } catch (error) {
                console.error('Errore salvataggio movimento:', error);
                alert('Errore nel salvataggio: ' + error.message);
            }
        }

        // Close movimento modal
        function closeMovimentoModal() {
            document.getElementById('movimentoModal').classList.add('hidden');
        }

        // Show nuovo prodotto
        function showNuovoProdotto() {
            document.getElementById('nuovoProdottoModal').classList.remove('hidden');
        }

        // Close nuovo prodotto modal
        function closeNuovoProdottoModal() {
            document.getElementById('nuovoProdottoModal').classList.add('hidden');
        }

        // Salva nuovo prodotto
        async function salvaNuovoProdotto() {
            const barcode = document.getElementById('nuovoBarcode').value.trim();
            const descrizione = document.getElementById('nuovoDescrizione').value.trim();

            if (!barcode || !descrizione) {
                alert('Barcode e Descrizione sono obbligatori');
                return;
            }

            try {
                const nuovoProdotto = {
                    barcode: barcode,
                    descrizione: descrizione,
                    codice: document.getElementById('nuovoCodice').value.trim(),
                    categoria: document.getElementById('nuovoCategoria').value,
                    giacenza: parseFloat(document.getElementById('nuovoGiacenza').value) || 0,
                    um: document.getElementById('nuovoUM').value,
                    prezzo_acquisto: parseFloat(document.getElementById('nuovoPrezzoAcquisto').value) || 0,
                    prezzo_vendita: parseFloat(document.getElementById('nuovoPrezzoVendita').value) || 0,
                    giacenza_minima: parseFloat(document.getElementById('nuovoGiacenzaMin').value) || 0,
                    created_by: currentUser.id
                };

                const { error } = await supabase
                    .from('components')
                    .insert(nuovoProdotto);

                if (error) throw error;

                alert('✅ Prodotto creato con successo!');
                closeNuovoProdottoModal();
                
                // Reset form
                document.getElementById('nuovoBarcode').value = '';
                document.getElementById('nuovoDescrizione').value = '';
                document.getElementById('nuovoCodice').value = '';
                document.getElementById('nuovoGiacenza').value = '0';
                
                await caricaProdotti();

            } catch (error) {
                console.error('Errore creazione prodotto:', error);
                alert('Errore nella creazione: ' + error.message);
            }
        }

        // Scan barcode per nuovo prodotto
        function scanBarcode() {
            toggleScanner();
            // Quando scansiona, riempie il campo barcode
        }

        // Init on load
        window.addEventListener('DOMContentLoaded', init);
    </script>

</body>
</html>
