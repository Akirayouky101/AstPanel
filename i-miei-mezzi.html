<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Miei Mezzi - AST Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <script src="supabase-client.js"></script>
    <script src="Admin/auth-helper.js"></script>
    <script src="modal-system.js"></script>
    <style>
        .vehicle-card {
            transition: all 0.3s ease;
        }
        .vehicle-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .animate-pulse-slow {
            animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Header -->
    <div class="bg-gradient-to-r from-orange-500 to-orange-700 text-white shadow-lg">
        <div class="container mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-4">
                    <button onclick="window.location.href='/pannello-utente.html'" class="hover:bg-orange-600 p-2 rounded">
                        <i class="fas fa-arrow-left"></i>
                    </button>
                    <div>
                        <h1 class="text-2xl font-bold">🚗 I Miei Mezzi</h1>
                        <p class="text-orange-100 text-sm">Prendi o restituisci un veicolo</p>
                    </div>
                </div>
                <div id="userInfo" class="text-right">
                    <p class="text-sm opacity-90" id="userName">Caricamento...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container mx-auto px-4 py-6 max-w-6xl">
        
        <!-- Miei Mezzi Attivi -->
        <div class="bg-white rounded-lg shadow-lg mb-6">
            <div class="bg-gradient-to-r from-blue-500 to-blue-600 text-white p-6 rounded-t-lg">
                <h2 class="text-xl font-bold flex items-center">
                    <i class="fas fa-key mr-3"></i>
                    I Miei Mezzi Attivi
                </h2>
            </div>
            <div id="myVehicles" class="p-6">
                <!-- Caricamento mezzi attivi -->
            </div>
        </div>

        <!-- Mezzi Disponibili -->
        <div class="bg-white rounded-lg shadow-lg">
            <div class="bg-gradient-to-r from-green-500 to-green-600 text-white p-6 rounded-t-lg">
                <h2 class="text-xl font-bold flex items-center">
                    <i class="fas fa-list mr-3"></i>
                    Mezzi Disponibili
                </h2>
            </div>
            <div id="availableVehicles" class="p-6">
                <!-- Caricamento mezzi disponibili -->
            </div>
        </div>

    </div>

    <!-- Modal Prendi Mezzo -->
    <div id="takeVehicleModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-xl shadow-2xl max-w-lg w-full">
            <div class="bg-gradient-to-r from-green-500 to-green-600 text-white p-6 rounded-t-xl">
                <h3 class="text-2xl font-bold">🚗 Prendi Veicolo</h3>
            </div>
            <form id="takeVehicleForm" class="p-6 space-y-4">
                <input type="hidden" id="selectedVehicleId">
                
                <div class="bg-gray-50 p-4 rounded-lg mb-4">
                    <p class="text-sm text-gray-600">Mezzo selezionato:</p>
                    <p class="font-bold text-lg" id="selectedVehicleName"></p>
                    <p class="text-gray-600" id="selectedVehicleTarga"></p>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Data Utilizzo *</label>
                    <input type="date" id="dataInizio" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-500">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Data Fine (opzionale)</label>
                    <input type="date" id="dataFine" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-500">
                    <p class="text-xs text-gray-500 mt-1">Lascia vuoto se è solo per oggi</p>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Ora Partenza</label>
                        <input type="time" id="oraInizio" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">KM Partenza</label>
                        <input type="number" id="kmPartenza" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-500" placeholder="es: 45000">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Destinazione</label>
                    <input type="text" id="destinazione" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-500" placeholder="es: Cantiere Via Roma, Milano">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Note (opzionali)</label>
                    <textarea id="note" rows="2" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-500" placeholder="Note aggiuntive..."></textarea>
                </div>

                <div class="flex justify-end space-x-3 pt-4">
                    <button type="button" onclick="closeTakeModal()" class="px-6 py-2 border border-gray-300 rounded-lg hover:bg-gray-50">
                        Annulla
                    </button>
                    <button type="submit" class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded-lg">
                        <i class="fas fa-check mr-2"></i>Conferma
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Restituisci Mezzo -->
    <div id="returnVehicleModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-xl shadow-2xl max-w-lg w-full">
            <div class="bg-gradient-to-r from-blue-500 to-blue-600 text-white p-6 rounded-t-xl">
                <h3 class="text-2xl font-bold">✅ Restituisci Veicolo</h3>
            </div>
            <form id="returnVehicleForm" class="p-6 space-y-4">
                <input type="hidden" id="returnAssignmentId">
                
                <div class="bg-gray-50 p-4 rounded-lg mb-4">
                    <p class="text-sm text-gray-600">Stai restituendo:</p>
                    <p class="font-bold text-lg" id="returnVehicleName"></p>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Ora Rientro</label>
                        <input type="time" id="oraFine" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">KM Arrivo *</label>
                        <input type="number" id="kmArrivo" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="es: 45150">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Note Rientro (opzionali)</label>
                    <textarea id="noteRientro" rows="2" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="Es: Tutto ok, serbatoio pieno"></textarea>
                </div>

                <div class="flex justify-end space-x-3 pt-4">
                    <button type="button" onclick="closeReturnModal()" class="px-6 py-2 border border-gray-300 rounded-lg hover:bg-gray-50">
                        Annulla
                    </button>
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg">
                        <i class="fas fa-check-double mr-2"></i>Restituisci
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let currentUser = null;
        let myAssignments = [];
        let availableVehicles = [];

        // Inizializzazione
        document.addEventListener('DOMContentLoaded', async () => {
            // Verifica autenticazione
            if (!await window.AuthHelper.requireLogin()) return;

            currentUser = window.AuthHelper.getCurrentUser();
            document.getElementById('userName').textContent = `${currentUser.nome} ${currentUser.cognome}`;

            // Imposta data di oggi come default
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('dataInizio').value = today;

            await loadData();
            lucide.createIcons();
        });

        // Carica dati
        async function loadData() {
            await Promise.all([
                loadMyVehicles(),
                loadAvailableVehicles()
            ]);
        }

        // Carica i miei mezzi attivi
        async function loadMyVehicles() {
            try {
                const { data, error } = await window.supabase
                    .from('vehicle_assignments')
                    .select('*, vehicle:vehicles(*)')
                    .eq('user_id', currentUser.id)
                    .eq('stato', 'attiva')
                    .order('data_inizio', { ascending: false });
                
                if (error) throw error;
                myAssignments = data || [];

                renderMyVehicles();
            } catch (error) {
                console.error('Errore caricamento miei mezzi:', error);
                showAlert('Errore', 'Impossibile caricare i tuoi mezzi: ' + error.message, 'error');
            }
        }

        // Carica mezzi disponibili
        async function loadAvailableVehicles() {
            try {
                const { data, error } = await window.supabase
                    .from('vehicles')
                    .select('*')
                    .eq('stato', 'disponibile')
                    .order('proprieta', { ascending: false })
                    .order('nome');
                
                if (error) throw error;

                // Filtra mezzi non assegnati
                const { data: activeAssignments } = await window.supabase
                    .from('vehicle_assignments')
                    .select('vehicle_id')
                    .eq('stato', 'attiva');
                
                const assignedIds = activeAssignments?.map(a => a.vehicle_id) || [];
                availableVehicles = (data || []).filter(v => !assignedIds.includes(v.id));

                renderAvailableVehicles();
            } catch (error) {
                console.error('Errore caricamento mezzi disponibili:', error);
                showAlert('Errore', 'Impossibile caricare i mezzi disponibili: ' + error.message, 'error');
            }
        }

        // Render i miei mezzi
        function renderMyVehicles() {
            const container = document.getElementById('myVehicles');
            
            if (myAssignments.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 text-gray-500">
                        <i class="fas fa-inbox text-6xl mb-4 opacity-20"></i>
                        <p class="text-lg">Non hai mezzi assegnati al momento</p>
                        <p class="text-sm mt-2">Prendi un veicolo dalla lista disponibili qui sotto</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = myAssignments.map(a => {
                const vehicle = a.vehicle;
                const tipoIcons = {
                    'furgone': '🚚',
                    'auto': '🚗',
                    'van': '🚐',
                    'camion': '🚛'
                };

                const kmPercorsi = a.km_partenza ? `<p class="text-sm text-gray-600 mt-2">
                    <i class="fas fa-tachometer-alt mr-1"></i> KM partenza: ${a.km_partenza.toLocaleString()}
                </p>` : '';

                return `
                    <div class="vehicle-card border-l-4 border-blue-500 bg-blue-50 rounded-lg p-6 mb-4">
                        <div class="flex items-start justify-between">
                            <div class="flex-1">
                                <div class="flex items-center space-x-3 mb-2">
                                    <span class="text-4xl">${tipoIcons[vehicle.tipo] || '🚗'}</span>
                                    <div>
                                        <h3 class="font-bold text-xl text-gray-800">${vehicle.nome}</h3>
                                        <p class="text-gray-600"><i class="fas fa-hashtag text-sm"></i> ${vehicle.targa}</p>
                                    </div>
                                </div>
                                <div class="mt-3 space-y-1">
                                    <p class="text-sm text-gray-600">
                                        <i class="fas fa-calendar mr-1"></i> Dal ${new Date(a.data_inizio).toLocaleDateString('it-IT')}
                                        ${a.data_fine ? ` al ${new Date(a.data_fine).toLocaleDateString('it-IT')}` : ''}
                                    </p>
                                    ${a.destinazione ? `<p class="text-sm text-gray-600">
                                        <i class="fas fa-map-marker-alt mr-1"></i> ${a.destinazione}
                                    </p>` : ''}
                                    ${kmPercorsi}
                                    ${a.note ? `<p class="text-sm text-gray-600 mt-2">
                                        <i class="fas fa-sticky-note mr-1"></i> ${a.note}
                                    </p>` : ''}
                                </div>
                            </div>
                            <button onclick="openReturnModal('${a.id}', '${vehicle.nome}')" 
                                class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg font-medium">
                                <i class="fas fa-check-double mr-2"></i>
                                Restituisci
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Render mezzi disponibili
        function renderAvailableVehicles() {
            const container = document.getElementById('availableVehicles');
            
            if (availableVehicles.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 text-gray-500">
                        <i class="fas fa-parking text-6xl mb-4 opacity-20"></i>
                        <p class="text-lg">Nessun mezzo disponibile al momento</p>
                        <p class="text-sm mt-2">Tutti i veicoli sono attualmente in uso</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    ${availableVehicles.map(v => {
                        const tipoIcons = {
                            'furgone': '🚚',
                            'auto': '🚗',
                            'van': '🚐',
                            'camion': '🚛'
                        };

                        const badge = v.proprieta === 'noleggio' 
                            ? '<span class="bg-purple-100 text-purple-800 text-xs px-2 py-1 rounded">Noleggio</span>'
                            : '<span class="bg-green-100 text-green-800 text-xs px-2 py-1 rounded">Aziendale</span>';

                        return `
                            <div class="vehicle-card border rounded-lg p-4 hover:shadow-lg bg-white">
                                <div class="flex items-start justify-between mb-3">
                                    <div class="flex-1">
                                        <div class="flex items-center space-x-2 mb-2">
                                            <span class="text-3xl">${tipoIcons[v.tipo] || '🚗'}</span>
                                            <div>
                                                <h3 class="font-bold text-gray-800">${v.nome}</h3>
                                                <p class="text-sm text-gray-600">
                                                    <i class="fas fa-hashtag text-xs"></i> ${v.targa}
                                                </p>
                                            </div>
                                        </div>
                                        ${v.marca ? `<p class="text-xs text-gray-500">${v.marca} ${v.modello || ''}</p>` : ''}
                                    </div>
                                    ${badge}
                                </div>
                                <button onclick="openTakeModal('${v.id}', '${v.nome}', '${v.targa}')" 
                                    class="w-full bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg font-medium">
                                    <i class="fas fa-hand-paper mr-2"></i>Prendi
                                </button>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        // Apri modal prendi mezzo
        function openTakeModal(vehicleId, nome, targa) {
            document.getElementById('selectedVehicleId').value = vehicleId;
            document.getElementById('selectedVehicleName').textContent = nome;
            document.getElementById('selectedVehicleTarga').textContent = `Targa: ${targa}`;
            document.getElementById('takeVehicleForm').reset();
            
            // Reimposta data di oggi
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('dataInizio').value = today;
            
            document.getElementById('takeVehicleModal').classList.remove('hidden');
        }

        function closeTakeModal() {
            document.getElementById('takeVehicleModal').classList.add('hidden');
        }

        // Apri modal restituisci
        function openReturnModal(assignmentId, vehicleName) {
            document.getElementById('returnAssignmentId').value = assignmentId;
            document.getElementById('returnVehicleName').textContent = vehicleName;
            document.getElementById('returnVehicleForm').reset();
            document.getElementById('returnVehicleModal').classList.remove('hidden');
        }

        function closeReturnModal() {
            document.getElementById('returnVehicleModal').classList.add('hidden');
        }

        // Prendi mezzo
        document.getElementById('takeVehicleForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            try {
                const vehicleId = document.getElementById('selectedVehicleId').value;
                const dataInizio = document.getElementById('dataInizio').value;
                const dataFine = document.getElementById('dataFine').value || null;
                const oraInizio = document.getElementById('oraInizio').value || null;
                const kmPartenza = document.getElementById('kmPartenza').value || null;
                const destinazione = document.getElementById('destinazione').value || null;
                const note = document.getElementById('note').value || null;

                // Crea assegnazione
                const { error } = await window.supabase
                    .from('vehicle_assignments')
                    .insert([{
                        vehicle_id: vehicleId,
                        user_id: currentUser.id,
                        data_inizio: dataInizio,
                        data_fine: dataFine,
                        ora_inizio: oraInizio,
                        km_partenza: kmPartenza ? parseInt(kmPartenza) : null,
                        destinazione: destinazione,
                        note: note,
                        stato: 'attiva'
                    }]);
                
                if (error) throw error;

                // Aggiorna stato veicolo a "in_uso"
                await window.supabase
                    .from('vehicles')
                    .update({ stato: 'in_uso' })
                    .eq('id', vehicleId);

                showNotification('✅ Mezzo preso con successo!', 'success');
                closeTakeModal();
                await loadData();
            } catch (error) {
                console.error('Errore:', error);
                showAlert('Errore', 'Impossibile prendere il mezzo: ' + error.message, 'error');
            }
        });

        // Restituisci mezzo
        document.getElementById('returnVehicleForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            try {
                const assignmentId = document.getElementById('returnAssignmentId').value;
                const oraFine = document.getElementById('oraFine').value || null;
                const kmArrivo = document.getElementById('kmArrivo').value;
                const noteRientro = document.getElementById('noteRientro').value || null;

                // Recupera assegnazione per avere vehicle_id
                const { data: assignment } = await window.supabase
                    .from('vehicle_assignments')
                    .select('vehicle_id, note')
                    .eq('id', assignmentId)
                    .single();

                // Aggiorna assegnazione
                const { error } = await window.supabase
                    .from('vehicle_assignments')
                    .update({
                        data_fine: new Date().toISOString().split('T')[0],
                        ora_fine: oraFine,
                        km_arrivo: parseInt(kmArrivo),
                        note: assignment.note ? `${assignment.note}\nRientro: ${noteRientro || 'OK'}` : noteRientro,
                        stato: 'completata'
                    })
                    .eq('id', assignmentId);
                
                if (error) throw error;

                // Riporta veicolo a "disponibile"
                await window.supabase
                    .from('vehicles')
                    .update({ stato: 'disponibile' })
                    .eq('id', assignment.vehicle_id);

                showNotification('✅ Mezzo restituito con successo!', 'success');
                closeReturnModal();
                await loadData();
            } catch (error) {
                console.error('Errore:', error);
                showAlert('Errore', 'Impossibile restituire il mezzo: ' + error.message, 'error');
            }
        });
    </script>
</body>
</html>
