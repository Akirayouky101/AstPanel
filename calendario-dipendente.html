    <!-- MOBILE OPTIMIZATIONS -->
    <link rel="stylesheet" href="mobile-optimizations.css">
    
    <style>
        .fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .user-gradient { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
        
        /* ===== GOOGLE CALENDAR STYLE ===== */
        .fc { font-family: 'Segoe UI', Roboto, Arial, sans-serif; background: #fff; }
        .fc .fc-toolbar { padding: 8px 0; }
        .fc .fc-toolbar-title { font-size: 20px; font-weight: 500; color: #3c4043; }
        .fc .fc-button {
            background: #fff !important; border: 1px solid #dadce0 !important;
            color: #3c4043 !important; border-radius: 4px !important;
            padding: 5px 12px !important; font-size: 14px !important;
            font-weight: 500 !important; box-shadow: none !important;
            text-transform: none !important; transition: background .15s !important;
        }
        .fc .fc-button:hover { background: #f1f3f4 !important; box-shadow: none !important; }
        .fc .fc-button-primary:not(:disabled).fc-button-active,
        .fc .fc-button-primary:not(:disabled):active {
            background: #e8f0fe !important; border-color: #1a73e8 !important;
            color: #1a73e8 !important; box-shadow: none !important;
        }
        .fc .fc-prev-button, .fc .fc-next-button {
            border-radius: 50% !important; width: 32px !important; height: 32px !important;
            padding: 0 !important; display: inline-flex !important;
            align-items: center !important; justify-content: center !important;
        }
        .fc .fc-col-header-cell { background: #fff; padding: 8px 0; border-color: #e0e0e0; }
        .fc .fc-col-header-cell-cushion {
            font-size: 11px; font-weight: 500; color: #70757a;
            text-transform: uppercase; text-decoration: none;
        }
        .fc .fc-daygrid-day { border-color: #e0e0e0; }
        .fc .fc-daygrid-day:hover { background: #f8f9fa; cursor: pointer; }
        .fc .fc-daygrid-day-number {
            font-size: 12px; color: #3c4043; padding: 4px 8px;
            text-decoration: none; font-weight: 400; line-height: 1;
        }
        .fc .fc-day-other .fc-daygrid-day-number { color: #b0b0b0; }
        .fc .fc-day-today { background: rgba(26,115,232,0.05) !important; }
        .fc .fc-day-today .fc-daygrid-day-number {
            background: #1a73e8; color: #fff !important; border-radius: 50%;
            width: 24px; height: 24px; display: flex; align-items: center;
            justify-content: center; font-weight: 500; margin: 2px;
        }
        .fc-event {
            border-radius: 4px !important; border: none !important;
            padding: 1px 5px !important; font-size: 11px !important;
            font-weight: 500 !important; cursor: pointer !important;
        }
        .fc-daygrid-event { white-space: nowrap; overflow: hidden; }
        .fc .fc-timegrid-slot { border-color: #e0e0e0; height: 28px; }
        .fc .fc-timegrid-axis { font-size: 10px; color: #70757a; }
        .fc .fc-list-day-cushion { background: #f8f9fa; }
        .fc .fc-list-event:hover td { background: #f1f3f4; cursor: pointer; }
        .fc .fc-more-popover {
            border-radius: 8px; box-shadow: 0 4px 12px rgba(0,0,0,.15);
            border: 1px solid #e0e0e0;
        }
        .fc .fc-more-popover .fc-popover-header {
            background: #1a73e8; color: #fff; border-radius: 8px 8px 0 0;
        }
        .fc .fc-scroller::-webkit-scrollbar { width: 6px; }
        .fc .fc-scroller::-webkit-scrollbar-thumb { background: #dadce0; border-radius: 3px; }
        /* Google Calendar look */
        body { font-family: 'Google Sans', Roboto, Arial, sans-serif !important; background: white !important; }
        .fc-theme-standard td, .fc-theme-standard th { border-color: #e8eaed !important; }
        .fc .fc-daygrid-day { min-height: 90px; }
        .mc-day:hover { background: #f1f3f4 !important; }
        .mc-today { background: #1a73e8 !important; color: white !important; font-weight: 600 !important; }
    </style>
</head>

    <script>
        // Current user (should be loaded from session)
        const currentUser = {
            id: 'mario',
            nome: 'Mario Rossi'
        };

        let calendar;
        let currentTaskId = null;

        document.addEventListener('DOMContentLoaded', async function() {
            lucide.createIcons();
            renderMiniCalendar();
            await initCalendar();
            await updateStats();
        });

        // ===== MINI CALENDARIO SIDEBAR =====
        let miniCalYear = new Date().getFullYear();
        let miniCalMonth = new Date().getMonth();
        const MINI_MONTHS = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];

        function renderMiniCalendar() {
            const container = document.getElementById('miniCalContainer');
            if (!container) return;
            const today = new Date();
            const firstDay = new Date(miniCalYear, miniCalMonth, 1);
            const lastDay = new Date(miniCalYear, miniCalMonth + 1, 0);
            const startDow = (firstDay.getDay() + 6) % 7;
            const dayLabels = ['L','M','M','G','V','S','D'];
            let cells = '';
            for (let i = 0; i < startDow; i++) cells += '<div></div>';
            for (let d = 1; d <= lastDay.getDate(); d++) {
                const isToday = d === today.getDate() && miniCalMonth === today.getMonth() && miniCalYear === today.getFullYear();
                const ds = `${miniCalYear}-${String(miniCalMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                cells += `<div onclick="miniCalGoToDate('${ds}')" style="display:flex;align-items:center;justify-content:center;height:26px;cursor:pointer;"><span class="${isToday ? 'mc-today' : 'mc-day'}" style="width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;${isToday ? 'background:#1a73e8;color:white;font-weight:600;' : 'color:#3c4043;'}transition:background 0.1s;">${d}</span></div>`;
            }
            container.innerHTML = `<div style="padding:0 4px;"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;"><span style="font-size:13px;font-weight:500;color:#3c4043;">${MINI_MONTHS[miniCalMonth]} ${miniCalYear}</span><div style="display:flex;"><button onclick="miniCalPrev()" style="width:28px;height:28px;border-radius:50%;border:none;background:none;cursor:pointer;font-size:18px;color:#3c4043;display:flex;align-items:center;justify-content:center;line-height:1;" onmouseover="this.style.background='#f1f3f4'" onmouseout="this.style.background='none'">&#8249;</button><button onclick="miniCalNext()" style="width:28px;height:28px;border-radius:50%;border:none;background:none;cursor:pointer;font-size:18px;color:#3c4043;display:flex;align-items:center;justify-content:center;line-height:1;" onmouseover="this.style.background='#f1f3f4'" onmouseout="this.style.background='none'">&#8250;</button></div></div><div style="display:grid;grid-template-columns:repeat(7,1fr);">${dayLabels.map(l => `<div style="text-align:center;font-size:10px;font-weight:500;color:#70757a;padding:2px 0;">${l}</div>`).join('')}${cells}</div></div>`;
        }
        function miniCalPrev() { miniCalMonth--; if (miniCalMonth < 0) { miniCalMonth = 11; miniCalYear--; } renderMiniCalendar(); }
        function miniCalNext() { miniCalMonth++; if (miniCalMonth > 11) { miniCalMonth = 0; miniCalYear++; } renderMiniCalendar(); }
        function miniCalGoToDate(ds) { if (calendar) { calendar.gotoDate(ds); updateCalTopTitle(); } }
        window.miniCalPrev = miniCalPrev;
        window.miniCalNext = miniCalNext;
        window.miniCalGoToDate = miniCalGoToDate;

        function updateCalTopTitle() {
            if (!calendar) return;
            const el = document.getElementById('calTopTitle');
            if (el) el.textContent = calendar.view.title;
            const d = calendar.getDate();
            miniCalYear = d.getFullYear();
            miniCalMonth = d.getMonth();
            renderMiniCalendar();
        }
        function setActiveViewBtn(btnId) {
            ['viewBtnMonth','viewBtnWeek','viewBtnList'].forEach(id => {
                const b = document.getElementById(id);
                if (!b) return;
                if (id === btnId) { b.style.color='#1a73e8'; b.style.background='#e8f0fe'; b.style.fontWeight='600'; }
                else { b.style.color='#3c4043'; b.style.background='white'; b.style.fontWeight='500'; }
            });
        }

        async function initCalendar() {
            try {
                const calendarEl = document.getElementById('calendar');
                const user = window.AuthHelper.getCurrentUser();
                
                const allEvents = await window.dataManager.syncCalendarFromTasks();
                const myEvents = allEvents.filter(event =>
                    event.extendedProps && event.extendedProps.userId === user.id
                );

                calendar = new FullCalendar.Calendar(calendarEl, {
                    initialView: 'dayGridMonth',
                    headerToolbar: false,
                    locale: 'it',
                    events: myEvents,
                    dayMaxEvents: true,
                    height: '100%',
                    datesSet: function() { updateCalTopTitle(); },
                    eventClick: function(info) {
                        info.jsEvent.preventDefault();
                        showEventDetails(info.event);
                    },
                    eventDidMount: function(info) {
                        info.el.title = info.event.title;
                    }
                });
                calendar.render();
                updateCalTopTitle();
            } catch (error) {
                console.error('Errore inizializzazione calendario:', error);
            }
        }
        
        async function renderSimpleList(container, events) {
            if (events.length === 0) {
                container.innerHTML = '<div class="text-center p-8 text-gray-500"><i data-lucide="calendar-off" class="w-12 h-12 mx-auto mb-2"></i><p>Nessuna lavorazione programmata</p></div>';
                lucide.createIcons();
                return;
            }
            
            // Load all tasks once to get client names
            const allTasks = await window.dataManager.getLavorazioni();
            
            // Group events by date
            const grouped = {};
            events.forEach(event => {
                const date = new Date(event.start).toLocaleDateString('it-IT');
                if (!grouped[date]) grouped[date] = [];
                grouped[date].push(event);
            });
            
            // Sort dates
            const sortedDates = Object.keys(grouped).sort((a, b) => {
                return new Date(a.split('/').reverse().join('-')) - new Date(b.split('/').reverse().join('-'));
            });
            
            let html = '<div class="space-y-4">';
            sortedDates.forEach(date => {
                const dateEvents = grouped[date];
                const dayName = new Date(dateEvents[0].start).toLocaleDateString('it-IT', { weekday: 'long' });
                
                html += `
                    <div class="border-l-4 border-blue-600 pl-4">
                        <div class="flex items-center gap-2 mb-2">
                            <i data-lucide="calendar-days" class="w-5 h-5 text-blue-600"></i>
                            <h3 class="font-bold text-lg capitalize">${dayName}, ${date}</h3>
                        </div>
                        <div class="space-y-2">
                `;
                
                dateEvents.forEach(event => {
                    const priorityColors = {
                        'alta': 'bg-red-100 border-red-500 text-red-700',
                        'media': 'bg-yellow-100 border-yellow-500 text-yellow-700',
                        'bassa': 'bg-green-100 border-green-500 text-green-700',
                        'normale': 'bg-blue-100 border-blue-500 text-blue-700'
                    };
                    const priority = event.extendedProps?.priority || 'normale';
                    const colorClass = priorityColors[priority] || priorityColors['normale'];
                    
                    // Get client name from task
                    let clientName = 'N/A';
                    if (event.extendedProps?.taskId) {
                        const task = allTasks.find(t => t.id === event.extendedProps.taskId);
                        if (task && task.client) {
                            clientName = task.client.ragione_sociale;
                        }
                    }
                    
                    html += `
                        <div class="border-l-2 ${colorClass} pl-3 py-2 rounded-r cursor-pointer hover:shadow-md transition-shadow" onclick='showEventFromList(${JSON.stringify(event).replace(/'/g, "&#39;")})'>
                            <div class="font-semibold">${event.title}</div>
                            <div class="text-sm opacity-75">Cliente: ${clientName}</div>
                        </div>
                    `;
                });
                
                html += `
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            
            container.innerHTML = html;
            lucide.createIcons();
        }
        
        window.showEventFromList = async function(event) {
            // Create a fake FullCalendar-like event object
            const fakeEvent = {
                extendedProps: event.extendedProps
            };
            await showEventDetails(fakeEvent);
        };

        async function updateStats() {
            try {
                const user = window.AuthHelper.getCurrentUser();
                const tasks = await window.dataManager.getLavorazioni();
                
                // Carica multi-assignments (solo se user.id è definito)
                let calMultiTaskIds = [];
                if (user && user.id) {
                    const { data: calMultiAssignments, error: assignError } = await supabaseClient
                        .from('task_assignments')
                        .select('task_id')
                        .eq('user_id', user.id);
                    
                    if (!assignError) {
                        calMultiTaskIds = calMultiAssignments?.map(a => a.task_id) || [];
                    }
                }
                
                // Filtra tasks: assigned_user_id O in task_assignments (escludi standby)
                const myTasks = tasks.filter(t => 
                    (t.assigned_user_id === user.id ||
                    calMultiTaskIds.includes(t.id)) &&
                    t.visibile !== false
                );
                
                const total = myTasks.length;
                const completed = myTasks.filter(t => t.stato === 'completato').length;
                const inProgress = myTasks.filter(t => t.stato === 'in_corso').length;
                
                document.getElementById('totalTasks').textContent = total;
                document.getElementById('completedTasks').textContent = completed;
                document.getElementById('inProgressTasks').textContent = inProgress;
            } catch (error) {
                console.error('Errore aggiornamento statistiche:', error);
            }
            
            // Listen for calendar updates from admin
            window.addEventListener('calendarSynced', function() {
                refreshCalendar();
            });
        }

        function refreshCalendar() {
            const myEvents = window.syncData.getCalendarEventsForUser(currentUser.id);
            calendar.removeAllEvents();
            calendar.addEventSource(myEvents);
            updateStats();
        }

        // Auto-refresh quando una lavorazione viene eliminata/archiviata
        window.addEventListener('lavorazione-deleted', () => refreshCalendar());

        async function updateStats() {
            try {
                const allTasks = await window.dataManager.getLavorazioni();
                
                // Carica multi-assignments per secondo updateStats
                const { data: calMultiAssignments2 } = await supabaseClient
                    .from('task_assignments')
                    .select('task_id')
                    .eq('user_id', currentUser.id);
                
                const calMultiTaskIds2 = calMultiAssignments2?.map(a => a.task_id) || [];
                
                // Filtra tasks
                const myTasks = allTasks.filter(t => 
                    (t.assigned_user_id || t.assegnatario) === currentUser.id ||
                    calMultiTaskIds2.includes(t.id)
                );
                
                document.getElementById('totalMyTasks').textContent = myTasks.length;
                document.getElementById('highPriorityCount').textContent = myTasks.filter(t => (t.priority || t.priorita) === 'alta').length;
                
                // Tasks due in next 7 days
                const nextWeek = new Date();
                nextWeek.setDate(nextWeek.getDate() + 7);
                const upcoming = myTasks.filter(t => {
                    const dueDate = new Date(t.deadline || t.scadenza);
                    return dueDate <= nextWeek && dueDate >= new Date() && (t.status || t.stato) !== 'completato';
                });
                document.getElementById('upcomingCount').textContent = upcoming.length;
                
                document.getElementById('completedCount').textContent = myTasks.filter(t => (t.status || t.stato) === 'completato').length;
            } catch (error) {
                console.error('Errore aggiornamento statistiche:', error);
            }
        }

                const descrizione = task.descrizione || task.description || 'Nessuna descrizione disponibile';

                const priorita = task.priorita || task.priority || 'normale';

                                    <div class="w-10 h-10 bg-gradient-to-br from-green-500 to-emerald-600 rounded-lg flex items-center justify-center flex-shrink-0">

                                    </div>
                                    <div class="flex-1 min-w-0">
                                        <p class="text-xs text-green-700 font-medium">Cliente</p>

                                    </div>
                                </div>
                            </div>
                            
                            <!-- Scadenza - ARANCIO -->

                                <div class="flex flex-col items-center text-center">
                                    <div class="w-10 h-10 bg-gradient-to-br from-orange-500 to-amber-600 rounded-lg flex items-center justify-center mb-2">
                                        <i data-lucide="calendar" class="w-5 h-5 text-white"></i>
                                    </div>
                                    <p class="text-xs text-orange-700 font-medium">Scadenza</p>
                                    <p class="font-bold text-sm ${isOverdue ? 'text-red-600' : 'text-gray-900'} mt-1">${scadenza ? new Date(scadenza).toLocaleDateString('it-IT', {day: '2-digit', month: '2-digit', year: 'numeric'}) : 'N/A'}</p>
                                </div>
                            </div>
                            
                            <!-- Priorità - ROSA -->
                            <div class="bg-gradient-to-br from-pink-50 to-rose-100 border-2 border-pink-200 rounded-xl p-3">
                                <div class="flex flex-col items-center text-center">
                                    <div class="w-10 h-10 bg-gradient-to-br from-pink-500 to-rose-600 rounded-lg flex items-center justify-center mb-2">
                                        <i data-lucide="alert-circle" class="w-5 h-5 text-white"></i>
                                    </div>
                                    <p class="text-xs text-pink-700 font-medium">Priorità</p>
                                    <p class="font-bold text-sm text-gray-900 mt-1">${getPriorityEmoji(priorita)} ${priorita.charAt(0).toUpperCase() + priorita.slice(1)}</p>
                                </div>
                            </div>
                            
                            <!-- Stato - BLU -->
                            <div class="col-span-2 bg-gradient-to-br from-blue-50 to-indigo-100 border-2 border-blue-200 rounded-xl p-3">
                                <div class="flex items-center gap-2">
                                    <div class="w-10 h-10 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-lg flex items-center justify-center flex-shrink-0">
                                        <i data-lucide="activity" class="w-5 h-5 text-white"></i>
                                    </div>
                                    <div class="flex-1 min-w-0">
                                        <p class="text-xs text-blue-700 font-medium">Stato</p>
                                        <p class="font-bold text-sm text-gray-900">${getStatusText(stato)}</p>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Categoria - GIALLO -->
                            ${assignedTeam ? `
                            <div class="col-span-2 bg-gradient-to-br from-purple-50 to-violet-100 border-2 border-purple-200 rounded-xl p-3">
                                <div class="flex items-center gap-2">
                                    <div class="w-10 h-10 bg-gradient-to-br from-purple-500 to-violet-600 rounded-lg flex items-center justify-center flex-shrink-0">
                                        <i data-lucide="users" class="w-5 h-5 text-white"></i>
                                    </div>
                                    <div class="flex-1 min-w-0">
                                        <p class="text-xs text-purple-700 font-medium">Team</p>
                                        <p class="font-bold text-sm text-gray-900 truncate">${assignedTeam}</p>
                                    </div>
                                </div>
                            </div>
                            ` : ''}
                            
                            <div class="col-span-2 bg-gradient-to-br from-yellow-50 to-amber-100 border-2 border-yellow-200 rounded-xl p-3">
                                <div class="flex items-center gap-2">
                                    <div class="w-10 h-10 bg-gradient-to-br from-yellow-500 to-amber-600 rounded-lg flex items-center justify-center flex-shrink-0">
                                        <i data-lucide="tag" class="w-5 h-5 text-white"></i>
                                    </div>
                                    <div class="flex-1 min-w-0">
                                        <p class="text-xs text-yellow-700 font-medium">Categoria</p>
                                        <p class="font-bold text-sm text-gray-900">${getCategoryText(categoria)}</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Progresso - CELESTE -->
                        ${progresso !== undefined ? `
                        <div class="bg-gradient-to-br from-cyan-50 to-sky-100 border-2 border-cyan-200 rounded-xl p-3">
                            <div class="flex items-center justify-between mb-2">

                                    <i data-lucide="trending-up" class="w-4 h-4 text-cyan-700"></i>

                                </div>
                                <span class="text-lg font-bold text-cyan-600">${progresso}%</span>

                            <div class="w-full bg-cyan-200 rounded-full h-2 overflow-hidden">

                        <!-- Orari intervento - modificabili dal dipendente -->
                        <div style="background:linear-gradient(135deg,#eef2ff,#e0e7ff);border:2px solid #a5b4fc;border-radius:16px;padding:12px">
                            <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
                                <span style="font-size:16px">⏰</span>
                                <span style="font-size:12px;font-weight:700;color:#3730a3">Orari Intervento</span>
                                <span style="font-size:10px;color:#6366f1;margin-left:auto">modificabile</span>
                            </div>
                            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px">
                                <div>
                                    <label style="font-size:11px;color:#4f46e5;font-weight:600;display:block;margin-bottom:4px">Ora Inizio</label>
                                    <input type="time" id="mobile-ora-inizio-${taskId}" value="${task.ora_inizio || ''}"

                                </div>
                                <div>
                                    <label style="font-size:11px;color:#4f46e5;font-weight:600;display:block;margin-bottom:4px">Ora Fine</label>

                            </div>

                                💾 Salva Orari
                            </button>
                        </div>
                        
                        <!-- Descrizione - GRIGIO CHIARO -->
                        <div class="bg-gray-50 border-2 border-gray-200 rounded-xl p-3">
                            <div class="flex items-start gap-2">
                                <i data-lucide="file-text" class="w-4 h-4 text-gray-600 mt-1 flex-shrink-0"></i>
                                <div class="flex-1">
                                    <p class="text-xs font-bold text-gray-700 mb-1">Descrizione</p>
                                    <p class="text-xs text-gray-600 leading-relaxed">${descrizione}</p>

                        <!-- Pulsante Chiudi -->

                // Show modal
                document.getElementById('taskDetailsModal').classList.remove('hidden');
                
                // Refresh icons
                setTimeout(() => lucide.createIcons(), 100);
                
            } catch (error) {
                console.error('❌ Errore caricamento task:', error);
                alert('Errore nel caricamento dei dettagli del task');
            }

        // Helper functions for formatting
        async function salvaOrariTask(taskId) {
            const oraInizio = document.getElementById(`mobile-ora-inizio-${taskId}`)?.value || null;
            const oraFine = document.getElementById(`mobile-ora-fine-${taskId}`)?.value || null;
            const btn = document.querySelector(`[onclick="salvaOrariTask('${taskId}')"]`);
            try {
                if (btn) { btn.textContent = '⏳ Salvataggio...'; btn.disabled = true; }
                const { data, error } = await supabaseClient
                    .from('tasks')
                    .update({ ora_inizio: oraInizio || null, ora_fine: oraFine || null })
                    .eq('id', taskId)
                    .select('id');
                if (error) throw error;
                if (!data || data.length === 0) {
                    // RLS ha bloccato silenziosamente l'aggiornamento
                    throw new Error('Non hai il permesso di modificare questo task. Contatta l\'amministratore.');
                }
                // Feedback visivo successo
                if (btn) {
                    btn.disabled = false;
                    btn.textContent = '✅ Salvato!';
                    btn.style.background = 'linear-gradient(135deg,#16a34a,#15803d)';
                    setTimeout(() => {
                        btn.textContent = '💾 Salva Orari';
                        btn.style.background = 'linear-gradient(135deg,#4f46e5,#7c3aed)';
                    }, 2000);
                }
            } catch (err) {
                console.error('Errore salvataggio orari:', err);
                if (btn) {
                    btn.disabled = false;
                    btn.textContent = '❌ Errore - riprova';
                    btn.style.background = 'linear-gradient(135deg,#dc2626,#b91c1c)';
                    setTimeout(() => {
                        btn.textContent = '💾 Salva Orari';
                        btn.style.background = 'linear-gradient(135deg,#4f46e5,#7c3aed)';
                    }, 3000);
                }
                alert('Errore nel salvataggio degli orari: ' + (err.message || err));
            }
        }

        function getPriorityEmoji(priority) {
            const emojis = {
                'alta': '⚠️',
                'media': '🟡',
                'bassa': '✅',
                'normale': '📋'
            };
            return emojis[priority] || emojis['normale'];
        }
        
        function getPriorityBadgeClass(priority) {
            const classes = {
                'alta': 'bg-red-100 text-red-700',
                'media': 'bg-yellow-100 text-yellow-700',
                'bassa': 'bg-green-100 text-green-700',
                'normale': 'bg-blue-100 text-blue-700'
            };
            return classes[priority] || classes['normale'];
        }
        
        function getPriorityText(priority) {
            const texts = {
                'alta': '🔴 Alta',
                'media': '🟡 Media',
                'bassa': '🟢 Bassa',
                'normale': '🔵 Normale'
            };
            return texts[priority] || texts['normale'];
        }
        
        function getStatusClass(status) {
            const classes = {
                'da_fare': 'bg-gray-100 text-gray-700',
                'in_corso': 'bg-blue-100 text-blue-700',
                'revisione': 'bg-yellow-100 text-yellow-700',
                'completato': 'bg-green-100 text-green-700'
            };
            return classes[status] || classes['da_fare'];
        }
        
        function getStatusText(status) {
            const texts = {
                'da_fare': 'Da Fare',
                'in_corso': 'In Corso',
                'revisione': 'In Revisione',
                'completato': 'Completato'
            };
            return texts[status] || 'Da Fare';
        }
        
        function getCategoryText(category) {
            const texts = {
                'antifurto': 'Antifurto',
                'videosorveglianza': 'Videosorveglianza',
                'networking': 'Networking',
                'automazione': 'Automazione',
                'generale': 'Generale'
            };
            return texts[category] || category.charAt(0).toUpperCase() + category.slice(1);
        }
        
        function formatDate(dateString) {
            if (!dateString) return 'N/A';
            const date = new Date(dateString);
            return date.toLocaleDateString('it-IT', { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            });
        }
        
        function closeTaskModal() {
            document.getElementById('taskDetailsModal').classList.add('hidden');
            currentTaskId = null;
        }

        function logout() {
            if (confirm('Sei sicuro di voler uscire?')) {
                window.location.href = 'Admin/index.html';
            }
        }
        
        // Toggle mobile sidebar (called from overlay)
        function toggleMobileSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            
            if (sidebar && overlay) {
                sidebar.classList.toggle('mobile-open');
                overlay.classList.toggle('active');
            }
        }
    </script>
